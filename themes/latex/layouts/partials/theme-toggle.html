<button id="theme-toggle" class="theme-toggle" aria-label="Theme: Light (click to switch to Sepia)" title="Theme: Light (click to switch to Sepia)">
  <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
  </svg>
  <svg class="book-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
  </svg>
  <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
</button>

<script>
  (function() {
    var themeOrder = ['light', 'sepia', 'dark'];
    var themeLabels = {
      'light': { current: 'Light', next: 'Sepia' },
      'sepia': { current: 'Sepia', next: 'Dark' },
      'dark':  { current: 'Dark',  next: 'Light' }
    };

    function getActiveTheme() {
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'dark' || attr === 'sepia' || attr === 'light') return attr;
      var stored = localStorage.getItem('theme');
      if (stored === 'dark' || stored === 'sepia' || stored === 'light') return stored;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function updateButton(theme) {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      var info = themeLabels[theme] || themeLabels['light'];
      var label = 'Theme: ' + info.current + ' (click for ' + info.next + ')';
      btn.setAttribute('title', label);
      btn.setAttribute('aria-label', label);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      try {
        localStorage.setItem('theme', theme);
      } catch (e) {}
      updateButton(theme);
    }

    var toggleBtn = document.getElementById('theme-toggle');
    if (toggleBtn) {
      updateButton(getActiveTheme());
      toggleBtn.addEventListener('click', function() {
        var current = getActiveTheme();
        var idx = themeOrder.indexOf(current);
        if (idx === -1) idx = 0;
        var next = themeOrder[(idx + 1) % themeOrder.length];
        setTheme(next);
      });
    }
  })();
</script>
